# Panoul de control Himbeerhof (Sveltia CMS).
# Textele au câte 3 variante: DE / EN / RO. Dacă EN sau RO e gol, pe site apare germana.
backend:
  name: github
  repo: Himbeerhof/Himbeerhof
  branch: main
  commit_messages:
    update: 'Panou: actualizat {{collection}} – {{slug}}'
site_url: https://himbeerhof.com
display_url: https://himbeerhof.com
media_folder: images
public_folder: /images
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
collections:
- name: continut
  label: Conținut site
  editor:
    preview: false
  files:
  - name: produse
    label: 🍓 Produse
    file: data/produkte.json
    fields:
    - label: Produse
      name: produkte
      widget: list
      label_singular: produs
      summary: '{{fields.name.de}} – {{fields.saison.de}}'
      hint: Trage de produse ca să schimbi ordinea. Apasă pe ✕ ca să ștergi un produs.
      fields:
      - label: Nume (pe card)
        name: name
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Afișează pe site
        name: sichtbar
        widget: boolean
        default: true
        hint: Dezactivează ca să ascunzi produsul temporar, fără să-l ștergi.
      - label: Sezon
        name: saison
        widget: object
        fields:
        - widget: string
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          required: false
          name: en
          label: 🇬🇧 English
        - widget: string
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: 'Ex.: Juni – Oktober, Ganzjährig Dacă lași gol EN sau RO, apare textul în germană.'
      - label: Culoarea etichetei de sezon
        name: farbe
        widget: select
        default: beere
        options:
        - label: Zmeură (roșu închis)
          value: beere
        - label: Roșu
          value: rot
        - label: Mov
          value: lila
        - label: Verde
          value: gruen
        - label: Galben
          value: gelb
        - label: Portocaliu
          value: orange
        - label: Gri
          value: grau
      - label: Text scurt (pe card)
        name: kurz
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Poză principală (pe card)
        name: bild
        widget: image
        choose_url: true
      - label: Titlu în fereastra de detalii
        name: titel
        widget: object
        fields:
        - widget: string
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          required: false
          name: en
          label: 🇬🇧 English
        - widget: string
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Subtitlu în fereastra de detalii
        name: untertitel
        widget: object
        fields:
        - widget: text
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: text
          required: false
          name: en
          label: 🇬🇧 English
        - widget: text
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Descriere detaliată
        name: beschreibung
        widget: object
        fields:
        - widget: text
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: text
          required: false
          name: en
          label: 🇬🇧 English
        - widget: text
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Galerie foto (din fermă)
        name: fotos
        widget: list
        required: false
        label_singular: poză
        summary: '{{fields.bild}}'
        fields:
        - label: Poză
          name: bild
          widget: image
          choose_url: true
  - name: piete
    label: 📍 Piețe săptămânale
    file: data/maerkte.json
    fields:
    - label: Piețe
      name: maerkte
      widget: list
      label_singular: piață
      summary: '{{fields.ort}} – {{fields.zeiten.de}}'
      fields:
      - label: Localitate
        name: ort
        widget: string
        hint: 'Ex.: Bregenz'
      - label: Loc / piață
        name: platz
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: 'Ex.: Kornmarktplatz Dacă lași gol EN sau RO, apare textul în germană.'
      - label: Zile și ore
        name: zeiten
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: 'Ex.: Dienstag & Freitag | 07:00 – 12:00 Uhr Dacă lași gol EN sau RO, apare textul în germană.'
      - label: Sezon (opțional)
        name: saison
        widget: object
        fields:
        - widget: string
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          required: false
          name: en
          label: 🇬🇧 English
        - widget: string
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: 'Ex.: April – Oktober. Lasă gol dacă e tot anul. Dacă lași gol EN sau RO, apare textul în germană.'
      - label: Evidențiază (chenar roșu)
        name: hervorheben
        widget: boolean
        default: false
      - label: Afișează pe site
        name: sichtbar
        widget: boolean
        default: true
