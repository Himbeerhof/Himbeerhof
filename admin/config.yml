# Panoul de control Himbeerhof (Sveltia CMS).
# Textele au câte 3 variante: DE / EN / RO. Dacă EN sau RO e gol, pe site apare germana.
backend:
  name: github
  repo: Himbeerhof/Himbeerhof
  branch: main
  commit_messages:
    update: 'Panou: actualizat {{collection}} – {{slug}}'
site_url: https://himbeerhof.com
display_url: https://himbeerhof.com
media_folder: images
public_folder: /images
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600
collections:
- name: continut
  label: Conținut site
  editor:
    preview: false
  files:
  - name: produse
    label: 🍓 Produse
    file: data/produkte.json
    fields:
    - label: Produse
      name: produkte
      widget: list
      label_singular: produs
      summary: '{{fields.name.de}} – {{fields.saison.de}}'
      hint: Trage de produse ca să schimbi ordinea. Apasă pe ✕ ca să ștergi un produs.
      fields:
      - label: Nume (pe card)
        name: name
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Afișează pe site
        name: sichtbar
        widget: boolean
        default: true
        hint: Dezactivează ca să ascunzi produsul temporar, fără să-l ștergi.
      - label: 🛒 Se poate comanda online
        name: bestellbar
        widget: boolean
        default: true
        hint: Apare la comandă doar în lunile din sezon (după câmpul Sezon).
      - label: 🛒 Preț (€)
        name: preis
        widget: number
        value_type: float
        min: 0
        step: 0.1
        required: false
        hint: Lasă gol ca să apară „Preț la tarabă”.
      - label: 🛒 Unitate
        name: einheit
        widget: select
        default: kg
        options: &id001
        - label: kg
          value: kg
        - label: Caserolă 250 g
          value: schale250
        - label: Caserolă 500 g
          value: schale500
        - label: Bucată
          value: stueck
        - label: Legătură
          value: bund
      - label: 🛒 Variante (categorii, ambalaje)
        name: varianten
        widget: list
        required: false
        label_singular: variantă
        summary: '{{fields.name.de}} – {{fields.preis}} €'
        hint: Opțional. Dacă adaugi variante (ex. categoria 1, 2, 3 sau kg / legătură), clientul le alege separat, fiecare cu prețul ei, iar prețul și unitatea de mai sus nu se mai folosesc.
        fields:
        - label: Denumire
          name: name
          widget: object
          fields:
          - widget: string
            name: de
            label: 🇩🇪 Deutsch
          - widget: string
            name: en
            label: 🇬🇧 English
            required: false
          - widget: string
            name: ro
            label: 🇷🇴 Română
            required: false
        - label: Preț (€)
          name: preis
          widget: number
          value_type: float
          min: 0
          step: 0.1
          required: false
        - name: einheit
          widget: select
          default: kg
          options: *id001
          label: Unitate
        - label: Afișează la comandă
          name: sichtbar
          widget: boolean
          default: true
      - label: Sezon
        name: saison
        widget: object
        fields:
        - widget: string
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          required: false
          name: en
          label: 🇬🇧 English
        - widget: string
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: 'Ex.: Juni – Oktober, Ganzjährig Dacă lași gol EN sau RO, apare textul în germană.'
      - label: Culoarea etichetei de sezon
        name: farbe
        widget: select
        default: beere
        options:
        - label: Zmeură (roșu închis)
          value: beere
        - label: Roșu
          value: rot
        - label: Mov
          value: lila
        - label: Verde
          value: gruen
        - label: Galben
          value: gelb
        - label: Portocaliu
          value: orange
        - label: Gri
          value: grau
      - label: Text scurt (pe card)
        name: kurz
        widget: object
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Poză principală (pe card)
        name: bild
        widget: image
        choose_url: true
      - label: Titlu în fereastra de detalii
        name: titel
        widget: object
        fields:
        - widget: string
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: string
          required: false
          name: en
          label: 🇬🇧 English
        - widget: string
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Subtitlu în fereastra de detalii
        name: untertitel
        widget: object
        fields:
        - widget: text
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: text
          required: false
          name: en
          label: 🇬🇧 English
        - widget: text
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Descriere detaliată
        name: beschreibung
        widget: object
        fields:
        - widget: text
          required: false
          name: de
          label: 🇩🇪 Deutsch
        - widget: text
          required: false
          name: en
          label: 🇬🇧 English
        - widget: text
          required: false
          name: ro
          label: 🇷🇴 Română
        required: false
        hint: Dacă lași gol EN sau RO, apare textul în germană.
      - label: Proveniență (de unde vine)
        name: herkunft
        widget: object
        required: false
        hint: Apare în fereastra de detalii, la „Herkunft”. Dacă lași gol EN sau RO, apare textul în germană.
        fields:
        - widget: string
          name: de
          label: 🇩🇪 Deutsch
          required: false
        - widget: string
          name: en
          label: 🇬🇧 English
          required: false
        - widget: string
          name: ro
          label: 🇷🇴 Română
          required: false
      - label: Galerie foto (din fermă)
        name: fotos
        widget: list
        required: false
        label_singular: poză
        summary: '{{fields.bild}}'
        fields:
        - label: Poză
          name: bild
          widget: image
          choose_url: true
  - name: piete
