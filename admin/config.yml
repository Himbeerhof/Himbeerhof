        widget: boolean
        default: false
      - label: 🛒 Zilele de piață (pentru comenzi)
        name: bestelltage
        widget: select
        multiple: true
        required: false
        options:
        - label: Luni
          value: mo
        - label: Marți
          value: di
        - label: Miercuri
          value: mi
        - label: Joi
          value: do
        - label: Vineri
          value: fr
        - label: Sâmbătă
          value: sa
        - label: Duminică
          value: so
        hint: Clientul poate alege doar aceste zile. Dacă piața are sezon (ex. Aprilie – Octombrie), în afara lui nu se poate comanda.
