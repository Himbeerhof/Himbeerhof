name: Pontaj APK
on:
  push:
    branches: [pontaj-app]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web build
        run: |
          npm ci
          npm run build
      - name: Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#a3123a' || echo "icon generation skipped"
          npx cap sync android
      - name: Build APK
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          cd android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Pontaj-Himbeerhof.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pontaj-Himbeerhof
          path: Pontaj-Himbeerhof.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pontaj-v${{ github.run_number }}
          name: Pontaj Himbeerhof 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Pontaj-Himbeerhof.apk
          body: Aplicația Android pentru pontajul angajaților. Descarcă Pontaj-Himbeerhof.apk și instalează-l pe telefon.
