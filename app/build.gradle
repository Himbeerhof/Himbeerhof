plugins { id 'com.android.application' }

def runNo = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.himbeerhof.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.himbeerhof.tv'
        minSdk 21
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }
    signingConfigs {
        rel {
            storeFile file('himbeertv.jks')
            storePassword 'himbeertv'
            keyAlias 'himbeertv'
            keyPassword 'himbeertv'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rel
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    def m3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$m3"
    implementation "androidx.media3:media3-exoplayer-hls:$m3"
    implementation "androidx.media3:media3-exoplayer-dash:$m3"
    implementation "androidx.media3:media3-ui:$m3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
