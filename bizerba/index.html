<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Bizerba – cititor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#B8234F">
<style>
:root{--bg:#f6f4f2;--card:#fff;--ink:#1d1b1a;--muted:#6f6a66;--line:#e5e0dc;--acc:#b8234f;--acc-soft:#fbe9ee;--ok:#1f7a4d;--warn:#a85d00;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#161413;--card:#211e1c;--ink:#f1ece8;--muted:#a39c96;--line:#36312e;--acc:#ec5a84;--acc-soft:#3a1d27;--ok:#5cc28d;--warn:#f0a64a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:0}h1 span{color:var(--acc)}
h2{font-size:16px;margin:18px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;position:relative;overflow:hidden;display:inline-block}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
select,input[type=text],input[type=search],input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc-soft);color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{color:var(--muted);display:block}.kpi b{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tr.sum td{font-weight:700;border-top:2px solid var(--line)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--acc-soft)}
td input{width:120px;padding:4px 7px}
.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.void td{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--acc-soft);color:var(--acc);margin-left:4px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1b1a;color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
.hidden{display:none!important}
.bar{height:6px;border-radius:3px;background:var(--acc);opacity:.6}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="row">
    <h1 class="grow">Casa <span>Bizerba</span> <small class="muted" style="font-size:13px;font-weight:400">– cititor de salvări</small></h1>
    <button class="btn hidden" id="inst">💻 Instalează pe PC</button>
    <label class="btn primary">📂 Alege folderul de pe stick<input type="file" id="f-dir" webkitdirectory multiple></label>
    <label class="btn">Fișiere…<input type="file" id="f-files" accept=".json" multiple></label>
  </div>
  <div class="row" style="margin-top:10px" id="filters">
    <select id="p-month"></select>
    <select id="p-market"><option value="">Toate piețele</option></select>
    <select id="p-kasse"><option value="">Toate casele</option></select>
    <span class="grow"></span>
    <span class="muted" id="st"></span>
  </div>
  <nav id="tabs">
    <button data-v="days" class="on">Încasări pe zi</button>
    <button data-v="art">Articole</button>
    <button data-v="bons">Bonuri</button>
    <button data-v="ops">Vânzători</button>
    <button data-v="stat">Statistici</button>
    <button data-v="vat">TVA &amp; Excel</button>
  </nav>
</div></header>
<main class="wrap" id="main"></main>
<script src="app.js" type="module"></script>
</body>
</html>
